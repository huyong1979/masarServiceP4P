[workspace]
authors = ["Yong Hu"]
name = "masarpy3"
version = "1.0"
description = "MASAR Py3 runtime with latest Qt"
channels = ["conda-forge"]
platforms = ["linux-64"]

[environments]
default = { solve-group = "default" }

[dependencies]
python = ">=3.14,<3.15"
pyside6 = ">=6.10,<7"
pip = ">=24"
matplotlib = ">=3.11.0,<4"
requests = ">=2.34.2,<3"
p4p = ">=4.1"

[pypi-dependencies]
cothread = { path = "./wheels/cothread-2.20.1-cp314-cp314-linux_x86_64.whl" }
