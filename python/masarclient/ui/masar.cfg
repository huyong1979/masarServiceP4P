[LDAP]
existing = True
# BNL Active Directory domain controllers (space-separated failover list).
# Validates the operator password directly against AD with NO Duo 2FA.
url = ldaps://dc1.bnl.gov:636 ldaps://dc2.bnl.gov:636 ldaps://dc3.bnl.gov:636
# UPN bind format; AD accepts short-name@domain.
username = %s@bnl.gov
# CA bundle used to verify the ldaps:// server certificate. The RHEL system
# trust store contains BNLRoot/SSP-ECA1; the conda python-ldap's own bundle
# does not, so reference the system bundle explicitly.
cacertfile = /etc/pki/tls/certs/ca-bundle.crt
# ignorepw=True keeps MASAR usable if every DC is unreachable (an 8-32 char
# password is then accepted without a successful bind). Olog logging still
# validates the password independently (wrong pw -> HTTP 401).
ignorepw = True
# --- previous NSLS2 OpenLDAP settings (unreachable from ops consoles) ---
#url = ldaps://ns0.cs.nsls2.local:636
#username = uid=%s,ou=people,dc=nsls2,dc=bnl,dc=gov
# --- Duo proxy enforces 2FA (undesirable: weak cell signal) ---
#url = ldaps://duoproxy.nsls2.bnl.gov:636
#username = uid=%s,dc=bnl,dc=gov

[Olog]
use = True
url = https://olog-acc.nsls2.bnl.gov/Olog
logbookname = Operations
#logbookname = Controls Commissoning 

[Order]
#DO NOT use ',' between two numbers, USE SPACE as separator
conf_order = 61 53 28 18 64 65
